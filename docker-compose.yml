version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: streamland-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --requirepass streamland123
      --bind 0.0.0.0
      --protected-mode no
    restart: unless-stopped

volumes:
  redis-data: