version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: streamland-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server --appendonly yes --requirepass streamland123
      --bind 0.0.0.0
      --protected-mode no
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "streamland123", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - streamland-network

  # Backend Instance 1 (Main)
  backend-1:
    build: ./backend
    container_name: streamland-backend-1
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=streamland123
      - NODE_ENV=production
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - streamland-network
    restart: unless-stopped

  # Backend Instance 2 (Scale)
  backend-2:
    build: ./backend
    container_name: streamland-backend-2
    ports:
      - "4001:4000"
    environment:
      - PORT=4000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=streamland123
      - NODE_ENV=production
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - streamland-network
    restart: unless-stopped

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: streamland-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
    networks:
      - streamland-network
    restart: unless-stopped

networks:
  streamland-network:
    driver: bridge

volumes:
  redis-data:
